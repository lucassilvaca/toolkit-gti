[package]
name = "toolkit-gti"
version = "1.3.10"
description = "Toolkit GTI - Windows Support Tool"
authors = ["GTI Team"]
edition = "2021"
default-run = "toolkit-gti"

[lib]
name = "toolkit_gti_lib"
crate-type = ["lib", "cdylib", "staticlib"]
doctest = false

[[bin]]
name = "toolkit-gti"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-websocket = "2"
# Segunda execução (atalho, Run do logon) foca a janela existente em vez de
# abrir outra instância brigando pela porta do chat e pelo named pipe.
tauri-plugin-single-instance = "2"
tauri-utils = "2.8"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
sysinfo = "0.31"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
# Assinatura de requisições da LAN (H2): o segredo compartilhado vira chave de
# HMAC e nunca trafega. Ver infra/net_auth.rs.
hmac = "0.12"
sha2 = "0.10"
ctrlc = "3.4"
once_cell = "1.19"
axum     = { version = "0.7", features = ["ws"] }
uuid     = { version = "1.10",   features = ["v4"] }
dashmap  = "6.0"
reqwest  = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# ICMP echo assíncrono via IP Helper API (IcmpSendEcho2), sem privilégios de admin.
# Usado na varredura de "PCs ligados" para pingar toda a /24 numa única thread de IO.
winping = "0.10"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Registry",
    "Win32_Globalization",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Data_Xml_Dom",
    "UI_Notifications",
] }

# Notificações nativas em plataformas não-Windows (D-Bus/etc).
# No Windows NÃO dependemos de notify-rust diretamente: usamos a API WinRT em
# infra/toast/desktop.rs. (notify-rust ainda entra transitivamente via
# tauri-plugin-notification, mas nunca é chamado para exibir toasts — então não
# há shell-out para PowerShell.)
[target.'cfg(not(windows))'.dependencies]
notify-rust = "4.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
